name: Setup Assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji imagemagick

      - name: Install Node dependencies
        run: npm ci

      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code

      - name: Write .env
        run: |
          cat <<'ENVEOF' > .env
          CLAUDE_CODE_OAUTH_TOKEN=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_BACKEND=claude-code
          FREESOUND_API_KEY=${{ secrets.FREESOUND_API_KEY }}
          ENVEOF

      - name: Run asset setup
        run: node scripts/setup-assets.js

      - name: Commit assets
        run: |
          git config user.name "reels-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f assets/
          if git diff --cached --quiet; then
            echo "No new assets"
          else
            git commit -m "[skip ci] Setup initial asset library"
            git push
          fi
