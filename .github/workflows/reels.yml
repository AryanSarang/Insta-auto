name: Post Reel

on:
  schedule:
    - cron: '30 22 * * *'  # 4:00 AM IST post
    - cron: '30 4 * * *'   # 10:00 AM IST post
    - cron: '0 18 * * *'   # Fill-queue at 11:30 PM IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (render only, do not post)'
        type: boolean
        default: false
      fill_queue:
        description: 'Fill queue count (0 = normal post)'
        type: number
        default: 0

concurrency:
  group: reels-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ffmpeg (static binary)
        run: |
          curl -sSL --retry 3 --retry-delay 5 \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
            -o /tmp/ffmpeg.tar.xz
          sudo tar -xJf /tmp/ffmpeg.tar.xz --strip-components=1 -C /usr/local/bin/ \
            --wildcards '*/ffmpeg' '*/ffprobe'
          rm /tmp/ffmpeg.tar.xz
          ffmpeg -version | head -1

      - name: Install imagemagick
        timeout-minutes: 3
        continue-on-error: true
        run: |
          sudo timeout 30 apt-get update -qq 2>/dev/null || true
          sudo timeout 90 apt-get install -y -qq --no-install-recommends imagemagick 2>/dev/null
          convert -version | head -1

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code

      - name: Write .env
        run: |
          cat <<'ENVEOF' > .env
          CLAUDE_CODE_OAUTH_TOKEN=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_BACKEND=claude-code
          FREESOUND_API_KEY=${{ secrets.FREESOUND_API_KEY }}
          IG_USER_ID=${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN=${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL=${{ secrets.ALERT_WEBHOOK_URL }}
          NOTIFY_ON_SUCCESS=${{ secrets.NOTIFY_ON_SUCCESS }}
          ENVEOF

      - name: Determine run mode
        id: mode
        run: |
          CRON="${{ github.event.schedule }}"
          DRY="${{ inputs.dry_run }}"
          FILL="${{ inputs.fill_queue }}"

          if [ "$CRON" = "0 18 * * *" ]; then
            echo "args=--fill-queue=2" >> "$GITHUB_OUTPUT"
          elif [ "$DRY" = "true" ]; then
            echo "args=--dry-run" >> "$GITHUB_OUTPUT"
          elif [ -n "$FILL" ] && [ "$FILL" != "0" ]; then
            echo "args=--fill-queue=$FILL" >> "$GITHUB_OUTPUT"
          elif [ "$CRON" = "30 22 * * *" ]; then
            echo "args=--slot=morning" >> "$GITHUB_OUTPUT"
          elif [ "$CRON" = "30 4 * * *" ]; then
            echo "args=--slot=evening" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run reels-bot
        run: node src/run.js ${{ steps.mode.outputs.args }}

      - name: Upload dry-run artifacts
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-output
          path: |
            out/*/reel.mp4
            out/*/caption.txt
            out/*/frame-*.jpg
          retention-days: 7

      - name: Commit data back to repo
        if: always()
        run: |
          git config user.name "reels-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/history.json queue/ assets/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "[skip ci] Update history, queue and assets"
            git push
          fi
